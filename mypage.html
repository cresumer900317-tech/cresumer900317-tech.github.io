<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>메이플키우기 라운지 | 회원정보</title>
  <link rel="stylesheet" href="./assets/css/style.css?v=46" />
  <link rel="apple-touch-icon" href="./assets/img/apple-touch-icon.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
</head>
<body data-page="mypage">
  <div id="app-shell"></div>
  <main></main>
  <script src="./assets/js/common.js?v=50"></script>
  <script>
  document.addEventListener("DOMContentLoaded", () => {
    renderShell();
    const user = getUser();
    const token = getToken();

    if (!user) {
      document.querySelector("main").innerHTML = `
        <div class="page-card">
          <div class="container" style="padding:60px 20px;text-align:center;">
            <p style="font-size:2.5rem;margin-bottom:12px;">🔒</p>
            <p style="font-size:1rem;color:var(--text-soft);margin-bottom:16px;">로그인 후 이용 가능합니다</p>
            <a href="./login?redirect=./mypage" class="board-submit-btn"
               style="display:inline-block;text-decoration:none;padding:10px 28px;">로그인</a>
          </div>
        </div>`;
      return;
    }

    document.querySelector("main").innerHTML = `
      <div class="page-card">
        <div class="container" style="padding-bottom:32px;">
          <h1 style="font-size:1.3rem;font-weight:800;color:var(--text);padding:24px 0 8px;">
            회원정보 관리
          </h1>
          <p style="color:var(--text-soft);font-size:0.88rem;margin-bottom:24px;">
            이메일과 생년월일을 등록하면 비밀번호를 잊었을 때 직접 재설정할 수 있습니다.
          </p>

          <div style="background:var(--surface);border:1px solid var(--border);
                      border-radius:var(--radius-md);padding:20px;margin-bottom:20px;">
            <div style="display:grid;grid-template-columns:100px 1fr;gap:12px 16px;align-items:center;">
              <span style="font-size:0.82rem;font-weight:600;color:var(--text-soft);">캐릭터명</span>
              <span style="font-size:0.92rem;font-weight:700;color:var(--text);">${user.character_name}</span>

              <span style="font-size:0.82rem;font-weight:600;color:var(--text-soft);">길드</span>
              <span style="font-size:0.92rem;color:var(--text);">${user.guild || "-"}</span>

              <span style="font-size:0.82rem;font-weight:600;color:var(--text-soft);">등급</span>
              <span style="font-size:0.92rem;color:var(--text);">${user.role}</span>
            </div>
          </div>

          <div style="background:var(--surface);border:1px solid var(--border);
                      border-radius:var(--radius-md);padding:20px;">
            <h2 style="font-size:1rem;font-weight:700;color:var(--text);margin-bottom:16px;">정보 수정</h2>

            <div style="margin-bottom:14px;">
              <label style="display:block;font-size:0.82rem;font-weight:600;color:var(--text-soft);margin-bottom:6px;">이메일</label>
              <input type="email" id="myEmail" placeholder="example@email.com"
                     style="width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius-md);font-size:0.92rem;" />
            </div>

            <div style="margin-bottom:14px;">
              <label style="display:block;font-size:0.82rem;font-weight:600;color:var(--text-soft);margin-bottom:6px;">생년월일</label>
              <input type="date" id="myBirth"
                     style="width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius-md);font-size:0.92rem;" />
            </div>

            <div id="profileMsg" style="padding:10px 14px;border-radius:var(--radius-md);font-size:0.83rem;font-weight:500;display:none;margin-bottom:12px;"></div>

            <button id="saveBtn" onclick="saveProfile()"
                    style="width:100%;padding:12px;background:var(--yellow);color:var(--white);border:none;
                           border-radius:var(--radius-md);font-size:0.95rem;font-weight:700;cursor:pointer;">
              저장
            </button>
          </div>

          <div style="margin-top:16px;text-align:center;">
            <a href="./login?tab=changepw" style="font-size:0.82rem;color:var(--amber);text-decoration:none;font-weight:600;">비밀번호 변경하기 →</a>
          </div>

          <div style="margin-top:28px;">
            <h2 style="font-size:1rem;font-weight:700;color:var(--text);margin-bottom:12px;">🚫 차단 목록</h2>
            <div id="blockList" class="block-list"><div class="loading-box" style="margin:0;">불러오는 중…</div></div>
          </div>
        </div>
      </div>
    `;

    // 기존 정보 로드
    loadProfile();
    loadBlocks();
  });

  async function loadBlocks() {
    const el = document.getElementById("blockList");
    if (!el) return;
    try {
      const list = await getMyBlocks();
      if (!list.length) {
        el.innerHTML = `<div style="font-size:0.84rem;color:var(--text-faint);padding:12px 0;">차단한 사용자가 없어요.</div>`;
        return;
      }
      el.innerHTML = list.map(n => `
        <div class="block-row">
          <span style="font-weight:600;color:var(--text);">${escapeHtml(n)}</span>
          <button class="block-unbtn" data-name="${escapeHtml(n)}">차단 해제</button>
        </div>`).join("");
      el.querySelectorAll(".block-unbtn").forEach(b => b.addEventListener("click", async () => {
        b.disabled = true; b.textContent = "해제 중…";
        if (await unblockUser(b.dataset.name)) loadBlocks();
        else { b.disabled = false; b.textContent = "차단 해제"; }
      }));
    } catch {
      el.innerHTML = `<div style="font-size:0.84rem;color:var(--text-faint);">목록을 불러올 수 없어요.</div>`;
    }
  }

  async function loadProfile() {
    try {
      const res = await fetch(`${API_BASE}/api/auth/profile`, {
        headers: { "Authorization": `Bearer ${getToken()}` }
      });
      if (res.ok) {
        const data = await res.json();
        if (data.email) document.getElementById("myEmail").value = data.email;
        if (data.birthdate) document.getElementById("myBirth").value = data.birthdate;
      }
    } catch {}
  }

  async function saveProfile() {
    const email = document.getElementById("myEmail").value.trim();
    const birthdate = document.getElementById("myBirth").value;
    const msg = document.getElementById("profileMsg");
    const btn = document.getElementById("saveBtn");

    if (!email && !birthdate) {
      msg.style.display = "block";
      msg.style.background = "#fff5f5"; msg.style.color = "#dc2626"; msg.style.border = "1px solid #fca5a5";
      msg.textContent = "이메일 또는 생년월일을 입력해주세요";
      return;
    }

    btn.disabled = true; btn.textContent = "저장 중...";

    try {
      const body = {};
      if (email) body.email = email;
      if (birthdate) body.birthdate = birthdate;

      const res = await fetch(`${API_BASE}/api/auth/update-profile`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${getToken()}` },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      msg.style.display = "block";
      if (res.ok) {
        msg.style.background = "#f0fdf4"; msg.style.color = "#16a34a"; msg.style.border = "1px solid #bbf7d0";
        msg.textContent = "저장되었습니다";
      } else {
        msg.style.background = "#fff5f5"; msg.style.color = "#dc2626"; msg.style.border = "1px solid #fca5a5";
        msg.textContent = data.detail || "저장 실패";
      }
    } catch {
      msg.style.display = "block";
      msg.style.background = "#fff5f5"; msg.style.color = "#dc2626"; msg.style.border = "1px solid #fca5a5";
      msg.textContent = "서버 연결 오류";
    } finally {
      btn.disabled = false; btn.textContent = "저장";
    }
  }
  </script>
</body>
</html>
