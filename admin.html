<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>메이플키우기 라운지 | 어드민</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, sans-serif; background: #fafafa; color: #1a1a1a; }

    .lock-screen {
      position: fixed; inset: 0; background: #fffbeb;
      display: flex; align-items: center; justify-content: center; z-index: 999;
    }
    .lock-box {
      background: #fff; border: 2px solid #fde68a; border-radius: 16px;
      padding: 40px 32px; text-align: center; width: 320px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
    }
    .lock-box h2 { font-size: 1.3rem; font-weight: 800; margin-bottom: 6px; }
    .lock-box p { font-size: 0.82rem; color: #6b7280; margin-bottom: 20px; }
    .lock-box input {
      width: 100%; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px;
      font-size: 1rem; text-align: center; letter-spacing: 4px; margin-bottom: 12px;
    }
    .lock-box input:focus { outline: none; border-color: #f59e0b; }
    .lock-btn { width: 100%; padding: 10px; background: #f59e0b; color: #fff; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 700; cursor: pointer; }
    .lock-btn:hover { background: #d97706; }
    .lock-error { color: #dc2626; font-size: 0.82rem; margin-top: 8px; }

    .main-ui { display: none; }
    .main-ui.unlocked { display: block; }

    .top-bar {
      background: #fff; border-bottom: 1px solid #e5e7eb;
      padding: 14px 20px; display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 10; flex-wrap: wrap; gap: 8px;
    }
    .top-bar h1 { font-size: 1rem; font-weight: 700; }
    .top-bar-right { display: flex; align-items: center; gap: 8px; }
    .top-bar a { font-size: 0.82rem; color: #6b7280; text-decoration: none; }
    .section-tab {
      padding: 5px 14px; border: 1px solid #e5e7eb; border-radius: 8px;
      background: #fff; font-size: 0.82rem; font-weight: 600; cursor: pointer; color: #6b7280;
    }
    .section-tab.active { background: #fef3c7; border-color: #fbbf24; color: #92400e; font-weight: 700; }
    .lock-out-btn { font-size: 0.75rem; color: #dc2626; background: none; border: 1px solid #fca5a5; border-radius: 999px; padding: 3px 10px; cursor: pointer; }

    .container { max-width: 900px; margin: 0 auto; padding: 24px 16px; }


    .month-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .month-bar label { font-size: 0.85rem; font-weight: 600; color: #374151; }
    .month-bar input[type=month] { padding: 7px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 0.9rem; }
    .month-bar button { padding: 7px 16px; background: #f59e0b; color: #fff; border: none; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
    .month-bar button:hover { background: #d97706; }

    .tab-bar { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
    .tab-btn { padding: 6px 16px; border: 1px solid #e5e7eb; border-radius: 999px; background: #fff; font-size: 0.82rem; font-weight: 500; cursor: pointer; color: #6b7280; }
    .tab-btn.active { background: #fef3c7; border-color: #fbbf24; color: #92400e; font-weight: 700; }

    .input-section { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
    .input-section h2 { font-size: 0.95rem; font-weight: 700; margin-bottom: 14px; color: #374151; }
    .input-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: end; }
    .input-row label { font-size: 0.78rem; font-weight: 600; color: #6b7280; display: block; margin-bottom: 4px; }
    .input-row input, .input-row select { width: 100%; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 0.88rem; }
    .input-row input:focus, .input-row select:focus { outline: none; border-color: #f59e0b; }
    .add-btn { padding: 9px 18px; background: #f59e0b; color: #fff; border: none; border-radius: 8px; font-weight: 700; font-size: 0.85rem; cursor: pointer; white-space: nowrap; }
    .add-btn:hover { background: #d97706; }

    .list-section { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; overflow: hidden; }
    .list-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid #e5e7eb; background: #f9fafb; flex-wrap: wrap; gap: 8px; }
    .list-header h2 { font-size: 0.9rem; font-weight: 700; color: #374151; }
    .list-header-right { display: flex; align-items: center; gap: 8px; }
    .total-chip { font-size: 0.78rem; font-weight: 700; background: #fef3c7; color: #92400e; padding: 3px 10px; border-radius: 999px; }
    .save-all-btn { padding: 5px 14px; background: #dcfce7; color: #16a34a; border: 1px solid #bbf7d0; border-radius: 8px; font-size: 0.78rem; font-weight: 700; cursor: pointer; }
    .del-all-btn { padding: 5px 14px; background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; border-radius: 8px; font-size: 0.78rem; font-weight: 700; cursor: pointer; }

    .member-row { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; padding: 10px 20px; border-bottom: 1px solid #f3f4f6; gap: 12px; }
    .member-row:last-child { border-bottom: none; }
    .member-row:hover { background: #fffbeb; }
    .member-rank { font-size: 0.75rem; color: #9ca3af; width: 20px; text-align: center; }
    .member-name { font-size: 0.88rem; font-weight: 600; }
    .edit-input { width: 100px; padding: 5px 8px; border: 1px solid #fbbf24; border-radius: 6px; font-size: 0.85rem; text-align: right; }
    .row-btns { display: flex; gap: 5px; }
    .save-btn { padding: 4px 10px; background: #dcfce7; color: #16a34a; border: none; border-radius: 6px; font-size: 0.75rem; font-weight: 600; cursor: pointer; }
    .del-btn { padding: 4px 10px; background: #fee2e2; color: #dc2626; border: none; border-radius: 6px; font-size: 0.75rem; font-weight: 600; cursor: pointer; }
    .empty-box { text-align: center; padding: 32px; color: #9ca3af; font-size: 0.88rem; }

    /* 유저 관리 */
    .user-row { display: grid; grid-template-columns: 1fr auto auto auto; align-items: center; padding: 12px 20px; border-bottom: 1px solid #f3f4f6; gap: 10px; }
    .user-row:last-child { border-bottom: none; }
    .user-row:hover { background: #fffbeb; }
    .status-badge { font-size: 0.72rem; padding: 2px 8px; border-radius: 999px; font-weight: 700; }
    .status-active { background: #dcfce7; color: #16a34a; }
    .status-pending { background: #fef3c7; color: #92400e; }
    .status-inactive { background: #fee2e2; color: #dc2626; }
    .approve-btn { padding: 5px 12px; background: #dcfce7; color: #16a34a; border: none; border-radius: 6px; font-size: 0.78rem; font-weight: 700; cursor: pointer; }
    .deactivate-btn { padding: 5px 12px; background: #fee2e2; color: #dc2626; border: none; border-radius: 6px; font-size: 0.78rem; font-weight: 700; cursor: pointer; }
    .guild-select { padding: 4px 8px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.82rem; }

    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1f2937; color: #fff; padding: 10px 20px; border-radius: 999px; font-size: 0.85rem; font-weight: 600; opacity: 0; transition: opacity 0.3s; z-index: 100; pointer-events: none; }
    .toast.show { opacity: 1; }

    @media (max-width: 600px) {
      .input-row { grid-template-columns: 1fr 1fr; }
      .input-row .add-btn { grid-column: span 2; width: 100%; }
    }
  </style>
  <link rel="apple-touch-icon" href="./assets/img/apple-touch-icon.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
</head>
<body>

<div class="lock-screen" id="lockScreen">
  <div class="lock-box">
    <div style="font-size:2.5rem;margin-bottom:12px;">😊</div>
    <h2>친구패밀리 어드민</h2>
    <p>관리자 계정으로 로그인해주세요</p>
    <input type="text" id="adminName" placeholder="캐릭터명" maxlength="30" style="margin-bottom:8px;letter-spacing:0;" />
    <input type="password" id="pwInput" placeholder="비밀번호" maxlength="20" onkeydown="if(event.key==='Enter')checkPw()" />
    <button class="lock-btn" onclick="checkPw()">입장</button>
    <div class="lock-error" id="pwError"></div>
  </div>
</div>

<div class="main-ui" id="mainUI">
  <div class="top-bar">
    <h1>😊 친구패밀리 · 어드민</h1>
    <div class="top-bar-right">
      <button class="section-tab active" id="tabUsers" onclick="showSection('users')">👥 유저 관리</button>
      <button class="section-tab" id="tabTemp" onclick="showSection('temp')">🆕 임시등록</button>
      <a href="./reorg" style="font-weight:700;color:#92400e;">📋 재편 보드</a>
      <a href="./">← 홈</a>
      <button class="lock-out-btn" onclick="lockOut()">🔒 잠금</button>
    </div>
  </div>

  <!-- 임시 길드원 등록 섹션 -->
  <div id="tempSection" style="display:none;">
    <div class="container">
      <div style="padding:20px 0 16px;">
        <h2 style="font-size:1rem;font-weight:700;margin-bottom:6px;">🆕 임시 길드원 등록</h2>
        <p style="font-size:0.82rem;color:#6b7280;margin-bottom:16px;">mgf.gg 크롤링 전에 새 길드원이 회원가입할 수 있도록 임시 등록합니다.<br>다음 크롤링 시 전투력 등 상세 정보가 자동으로 업데이트됩니다.</p>
      </div>
      <div class="input-section">
        <h2>➕ 길드원 등록</h2>
        <div class="input-row">
          <div><label>캐릭터명</label><input type="text" id="tempName" placeholder="캐릭터명 입력" /></div>
          <div><label>소속 길드</label>
            <select id="tempGuild">
              <option>친구들</option><option>친구둘</option><option>친구삼</option><option>친구넷</option><option>친구닷</option>
            </select>
          </div>
          <button class="add-btn" onclick="addTempMember()">등록</button>
        </div>
      </div>
      <div class="input-section">
        <h2>🔤 닉네임 변경 처리</h2>
        <p style="font-size:0.78rem;color:#6b7280;margin-bottom:12px;">게임에서 닉변한 길드원의 계정·성장이력·포인트·게시글·배치보드를 새 이름으로 한 번에 이관합니다.<br>처리 후 해당 유저는 <b>새 이름으로 재로그인</b>해야 해요.</p>
        <div class="input-row">
          <div><label>이전 캐릭터명</label><input type="text" id="renameOld" placeholder="옛 이름" /></div>
          <div><label>새 캐릭터명</label><input type="text" id="renameNew" placeholder="바뀐 이름" /></div>
          <button class="add-btn" onclick="renameCharacter()">이관</button>
        </div>
        <div id="renameResult" style="font-size:0.78rem;color:#16a34a;margin-top:10px;"></div>
      </div>
    </div>
  </div>

  <!-- 유저 관리 섹션 -->
  <div id="userSection" style="display:none;">
    <div class="container">
      <div style="padding:20px 0 16px;">
        <h2 style="font-size:1rem;font-weight:700;margin-bottom:16px;">👥 유저 관리</h2>
        <div class="tab-bar">
          <button class="tab-btn active" onclick="loadUsers('pending', this)">⏳ 승인 대기</button>
          <button class="tab-btn" onclick="loadUsers('active', this)">✅ 활성</button>
          <button class="tab-btn" onclick="loadUsers('inactive', this)">🚫 비활성</button>
        </div>
      </div>
      <div class="list-section">
        <div class="list-header"><h2 id="userListTitle">승인 대기</h2></div>
        <div id="userList"><div class="empty-box">불러오는 중...</div></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = "https://guild-backend-production-75a6.up.railway.app";

// ── 관리자 로그인 ──
async function checkPw() {
  const name = document.getElementById("adminName").value.trim();
  const pw = document.getElementById("pwInput").value;
  const errEl = document.getElementById("pwError");
  if (!name || !pw) { errEl.textContent = "캐릭터명과 비밀번호를 입력해주세요"; return; }
  try {
    const res = await fetch(`${API}/api/auth/login`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ character_name: name, password: pw }),
    });
    const data = await res.json();
    if (!res.ok) { errEl.textContent = data.detail || "로그인 실패"; document.getElementById("pwInput").value = ""; return; }
    if (!data.token) { errEl.textContent = "토큰 발급 실패"; return; }
    // 역할 확인 — admin 또는 superadmin만 허용
    const role = data.user?.role || "member";
    if (role !== "admin" && role !== "superadmin") {
      errEl.textContent = "관리자 권한이 없는 계정입니다";
      return;
    }
    sessionStorage.setItem("token", data.token);
    sessionStorage.setItem("admin_ok", "1");
    sessionStorage.setItem("user", JSON.stringify({ character_name: name, role }));
    document.getElementById("lockScreen").style.display = "none";
    document.getElementById("mainUI").classList.add("unlocked");
    init();
  } catch { errEl.textContent = "서버 연결 실패"; }
}
function lockOut() {
  sessionStorage.removeItem("admin_ok");
  sessionStorage.removeItem("token");
  location.reload();
}
if (sessionStorage.getItem("admin_ok") === "1" && sessionStorage.getItem("token")) {
  document.getElementById("lockScreen").style.display = "none";
  document.getElementById("mainUI").classList.add("unlocked");
  init();
}

function showSection(sec) {
  document.getElementById("userSection").style.display = sec === "users" ? "block" : "none";
  document.getElementById("tempSection").style.display = sec === "temp" ? "block" : "none";
  document.getElementById("tabUsers").classList.toggle("active", sec === "users");
  document.getElementById("tabTemp").classList.toggle("active", sec === "temp");
  if (sec === "users") loadUsers("pending");
}

async function init() {
  showSection("users");
}

// ── 유저 관리 ──
let isSuperAdmin = false;

async function loadUsers(status, btn) {
  if (btn) {
    document.querySelectorAll("#userSection .tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
  }
  // superadmin 여부 확인
  try {
    const meRes = await fetch(`${API}/api/auth/users`, { headers: { "Authorization": "Bearer " + sessionStorage.getItem("token") } });
    const allUsers = await meRes.json();
    // 세션에서 캐릭터명 가져오기
    const savedUser = JSON.parse(sessionStorage.getItem("user") || "null");
    if (savedUser) {
      const me = allUsers.find(u => u.character_name === savedUser.character_name);
      isSuperAdmin = me?.role === "superadmin";
    }
  } catch {}
  const labels = { pending: "승인 대기", active: "활성 유저", inactive: "비활성 유저" };
  document.getElementById("userListTitle").textContent = labels[status] || status;
  try {
    const res = await fetch(`${API}/api/auth/users?status=${status}`, { headers: { "Authorization": "Bearer " + sessionStorage.getItem("token") } });
    const users = await res.json();
    const el = document.getElementById("userList");
    if (!users.length) { el.innerHTML = `<div class="empty-box">해당하는 유저가 없어요</div>`; return; }
    // 현재 로그인된 어드민 role 확인 (sessionStorage에서)
    // superadmin 여부는 API로 확인
    el.innerHTML = users.map(u => `
      <div class="user-row">
        <div>
          <div style="font-weight:700;font-size:0.9rem;">${u.character_name}</div>
          <div style="font-size:0.75rem;color:#9ca3af;">${u.guild||"미배정"} · ${new Date(u.created_at).toLocaleDateString("ko-KR")}</div>
        </div>
        <div style="display:flex;align-items:center;gap:6px;">
          <span class="status-badge status-${u.status}">${u.status==="active"?"활성":u.status==="pending"?"대기":"비활성"}</span>
          <span class="role-badge role-${u.role||"member"}">${u.role==="superadmin"?"슈퍼어드민":u.role==="admin"?"어드민":"유저"}</span>
        </div>
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
          ${isSuperAdmin ? `
            <select class="guild-select" onchange="changeRole('${u.character_name}', this.value)">
              <option value="member" ${(u.role||"member")==="member"?"selected":""}>유저</option>
              <option value="admin" ${u.role==="admin"?"selected":""}>어드민</option>
              <option value="superadmin" ${u.role==="superadmin"?"selected":""}>슈퍼어드민</option>
            </select>
          ` : ""}
          ${u.status === "pending" ? `
            <select class="guild-select" id="ug_${u.character_name}">
              <option value="">길드 선택</option>
              <option>친구들</option><option>친구둘</option><option>친구삼</option><option>친구넷</option><option>친구닷</option>
            </select>
            <button class="approve-btn" onclick="approveUser('${u.character_name}', 'pending')">승인</button>
          ` : u.status === "active" ? `
            <button class="approve-btn" onclick="resetPassword('${u.character_name}')">🔑 PW리셋</button>
            <button class="deactivate-btn" onclick="deactivateUser('${u.character_name}')">비활성화</button>
          ` : `
            <button class="approve-btn" onclick="approveUser('${u.character_name}', 'inactive')">재활성화</button>
          `}
        </div>
      </div>
    `).join("");
  } catch { showToast("로드 실패", false); }
}

async function changeRole(name, role) {
  const token = sessionStorage.getItem("token");
  try {
    const res = await fetch(`${API}/api/auth/role`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
      body: JSON.stringify({ character_name: name, role }),
    });
    if (!res.ok) { const err = await res.json().catch(() => ({})); throw new Error(err.detail || "변경 실패"); }
    showToast(`${name} → ${role === "superadmin" ? "슈퍼어드민" : role === "admin" ? "어드민" : "유저"} 변경 완료`);
  } catch (e) { showToast(e.message || "변경 실패", false); }
}

async function approveUser(name, fromStatus) {
  const guildEl = document.getElementById(`ug_${name}`);
  const guild = guildEl ? guildEl.value : "";
  const token = sessionStorage.getItem("token");
  try {
    const res = await fetch(`${API}/api/auth/approve`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
      body: JSON.stringify({ character_name: name, guild }),
    });
    if (!res.ok) { const err = await res.json().catch(() => ({})); throw new Error(err.detail || "승인 실패"); }
    showToast(`${name} 승인 완료 ✓`);
    loadUsers(fromStatus);
  } catch (e) { showToast(e.message || "실패", false); }
}

async function deactivateUser(name) {
  if (!confirm(`${name}을 비활성화할까요?`)) return;
  const token = sessionStorage.getItem("token");
  try {
    const res = await fetch(`${API}/api/auth/deactivate`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
      body: JSON.stringify({ character_name: name }),
    });
    if (!res.ok) { const err = await res.json().catch(() => ({})); throw new Error(err.detail || "비활성화 실패"); }
    showToast(`${name} 비활성화 완료`);
    loadUsers("active");
  } catch (e) { showToast(e.message || "실패", false); }
}

async function resetPassword(name) {
  const newPw = prompt(name + "의 새 비밀번호를 입력하세요 (4자 이상):");
  if (!newPw) return;
  if (newPw.length < 4) { showToast("비밀번호는 4자 이상이어야 합니다", false); return; }
  const token = sessionStorage.getItem("token");
  if (!token) { showToast("토큰이 없습니다. 다시 로그인해주세요", false); return; }
  try {
    const url = API + "/api/auth/reset-password";
    console.log("Reset PW:", url, name, "token:", token.substring(0,20));
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify({ character_name: name, new_password: newPw }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "리셋 실패");
    showToast(name + " 비밀번호 리셋 완료 → 임시PW: " + newPw);
  } catch (e) {
    console.error("Reset PW error:", e);
    showToast("리셋 실패: " + (e.message || "알 수 없는 오류"), false);
  }
}

// ── 임시 길드원 등록 ──
async function addTempMember() {
  const name = document.getElementById("tempName").value.trim();
  const guild = document.getElementById("tempGuild").value;
  if (!name) { showToast("캐릭터명을 입력해주세요", false); return; }
  const token = sessionStorage.getItem("token");
  try {
    const res = await fetch(`${API}/api/members/temp`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify({ name, guild }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "등록 실패");
    showToast(`${name} 임시 등록 완료 (${guild})`);
    document.getElementById("tempName").value = "";
  } catch (e) { showToast(e.message || "등록 실패", false); }
}

async function renameCharacter() {
  const oldName = document.getElementById("renameOld").value.trim();
  const newName = document.getElementById("renameNew").value.trim();
  const resultEl = document.getElementById("renameResult");
  resultEl.textContent = "";
  if (!oldName || !newName) { showToast("이전/새 이름을 모두 입력해주세요", false); return; }
  if (!confirm(`'${oldName}' → '${newName}' 으로 모든 데이터를 이관할까요?`)) return;
  try {
    const res = await fetch(`${API}/api/admin/rename`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${sessionStorage.getItem("token")}` },
      body: JSON.stringify({ old_name: oldName, new_name: newName }),
    });
    const data = await res.json();
    if (!res.ok) { showToast(data.detail || "이관 실패", false); return; }
    const parts = Object.entries(data.changed || {}).map(([k, v]) => `${k} ${v}건`);
    resultEl.textContent = parts.length
      ? `✅ 이관 완료: ${parts.join(", ")}`
      : "⚠️ 이관된 데이터가 없어요 — 이전 이름 철자를 확인해주세요";
    showToast("닉변 처리 완료");
    document.getElementById("renameOld").value = "";
    document.getElementById("renameNew").value = "";
  } catch (e) { showToast("서버 연결 실패", false); }
}

function showToast(msg, ok = true) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.background = ok ? "#1f2937" : "#dc2626";
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2500);
}
