<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Friends 화면 검증</title><style>body{font:14px system-ui;margin:16px;background:#eef1e9;color:#253520}header{display:flex;gap:16px;align-items:center;margin-bottom:16px}select{padding:10px}main{display:flex;gap:24px;align-items:flex-start}iframe{border:1px solid #bdc7b2;background:white;height:820px}h2{font-size:14px}</style></head><body><header><strong>반응형 화면 검증</strong><label>페이지 <select id="page"><option value="">홈</option><option value="ranking">랭킹</option><option value="profile?n=군보">프로필</option><option value="notice">공지</option><option value="tips">공략</option><option value="points">출석</option><option value="level-calc">계산기</option><option value="sources">수집 현황</option></select></label><label>너비 <select id="width"><option>390</option><option>360</option><option>768</option><option>1280</option></select></label></header><main><section><h2 id="label">390px</h2><iframe id="screen" title="반응형 사이트 화면" width="390" src="../"></iframe></section></main><script>const frame=document.getElementById('screen');document.getElementById('page').onchange=e=>frame.src='../'+e.target.value;document.getElementById('width').onchange=e=>{frame.width=e.target.value;document.getElementById('label').textContent=e.target.value+'px';};</script></body></html>
