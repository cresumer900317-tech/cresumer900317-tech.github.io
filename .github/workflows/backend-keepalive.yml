name: backend-keepalive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Railway backend
        run: |
          set -e
          URL="https://guild-backend-production-75a6.up.railway.app/healthz"
          for i in 1 2 3; do
            if curl -fsS -m 30 "$URL"; then
              echo
              echo "ok on attempt $i"
              exit 0
            fi
            echo "attempt $i failed; retrying after 10s"
            sleep 10
          done
          echo "all attempts failed"
          exit 1
